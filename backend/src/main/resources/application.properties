spring.application.name=phishing-checker
server.port=8081

# Optional. Empty when VIRUSTOTAL_API_KEY is unset, which leaves the integration disabled.
virustotal.api-key=${VIRUSTOTAL_API_KEY:}

# PhishTank stays off unless PHISHTANK_ENABLED is true. The application key is optional.
phishtank.enabled=${PHISHTANK_ENABLED:false}
phishtank.app-key=${PHISHTANK_APP_KEY:}
phishtank.user-agent=${PHISHTANK_USER_AGENT:phishing-checker (URL reputation lookup)}

